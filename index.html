<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f7fb">
  <title>TISC 2026 | Certificates</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#142c49}
    header{width:min(calc(100% - 24px),800px);min-height:56px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:16px}header span{margin-left:12px;color:#536b85;font-size:14px}header a{color:#1d4f85;font-size:13px;text-decoration:underline;text-underline-offset:3px}
    iframe{display:block;width:100%;height:calc(100dvh - 56px);min-height:620px;border:0;background:#f3f7fb}
    .setup{max-width:800px;margin:20px auto;padding:30px;background:#fff;border:1px solid #d9e4f0;border-top:7px solid #3975b8;border-radius:12px}.setup h1{margin:0 0 12px}.setup p{line-height:1.6}.setup a{color:#1d4f85}
    @media(max-width:480px){header span{display:none}header{width:calc(100% - 20px)}.setup{margin:12px 10px;padding:22px 18px}}
  </style>
</head>
<body>
  <header><div><strong>TISC 2026</strong><span>/ Certificates</span></div></header>
  <main id="mount" aria-live="polite"><section class="setup"><h1>Your TISC 2026 certificate</h1><p>The certificate portal is not available yet. Please check back later or <a href="mailto:supachok256147216@gmail.com">contact the organizing team</a>.</p></section></main>
  <noscript><p>Please enable JavaScript to use the certificate portal.</p></noscript>
  <script src="config.js"></script>
  <script>
    (function(){
      var url=window.TISC_CERTIFICATE_APP_URL;
      if(typeof url!=='string'||!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url))return;
      var frame=document.createElement('iframe');frame.title='TISC 2026 Certificate Portal';frame.src=url;frame.referrerPolicy='no-referrer';document.getElementById('mount').replaceChildren(frame);
    })();
  </script>
</body>
</html>
